<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Tachyon{% endblock %}</title>
  <style>
    :root { color-scheme: light; --ink: #1f2937; --muted: #6b7280;
      --accent: #4f46e5; --line: #e5e7eb; --surface: #ffffff; --bg: #f8fafc; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      color: var(--ink); background: var(--bg); }
    .site-header { display: flex; align-items: center; gap: 1rem; padding: .75rem 1rem;
      background: var(--surface); border-bottom: 1px solid var(--line); }
    .brand { font-weight: 700; text-decoration: none; color: var(--ink); font-size: 1.05rem; }
    .user-email { color: var(--muted); font-size: .85rem; margin-left: auto; }
    main { max-width: 60rem; margin: 0 auto; padding: 1rem; }
    h1 { font-size: 1.35rem; margin: .25rem 0 1rem; }
    .month-label { color: var(--muted); margin-top: -0.75rem; font-size: .9rem; }
    .cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: .75rem; }
    .card { background: var(--surface); border: 1px solid var(--line); border-radius: .6rem;
      padding: .75rem .9rem; }
    .card h2 { font-size: .8rem; color: var(--muted); margin: 0 0 .35rem; font-weight: 600; }
    .amount-income { color: #047857; }
    .amount-expense { color: #b91c1c; }
    .card p { margin: 0; font-size: 1.15rem; font-variant-numeric: tabular-nums; }
    .filters, .meta, .loading, .empty-state { color: var(--muted); font-size: .9rem; }
    .filters { display: flex; flex-wrap: wrap; gap: .5rem; margin: 1rem 0 .5rem; }
    .filters label { display: flex; flex-direction: column; font-size: .75rem; gap: .2rem; }
    .filters input, .filters select, .btn { font: inherit; padding: .3rem .5rem;
      border: 1px solid var(--line); border-radius: .4rem; background: var(--surface); }
    .btn { cursor: pointer; background: var(--accent); color: #fff; border-color: var(--accent); }
    .btn.link { background: none; border-color: var(--line); color: var(--accent);
      text-decoration: none; align-self: flex-end; }
    table { width: 100%; border-collapse: collapse; background: var(--surface);
      border: 1px solid var(--line); border-radius: .6rem; }
    th, td { text-align: left; padding: .45rem .6rem; border-bottom: 1px solid var(--line);
      font-size: .85rem; font-variant-numeric: tabular-nums; }
    th { color: var(--muted); font-weight: 600; }
    .badge { padding: .1rem .45rem; border-radius: .4rem; font-size: .75rem; }
    .badge.income { background: #d1fae5; color: #065f46; }
    .badge.expense { background: #fee2e2; color: #7f1d1d; }
    .table-wrap { overflow-x: auto; }
    .empty-state { border: 1px dashed var(--line); border-radius: .6rem;
      padding: 1rem; background: var(--surface); }
    code { background: var(--line); border-radius: .3rem; padding: 0 .3rem; }
    @media (max-width: 600px) {
      .cards { grid-template-columns: 1fr 1fr; }
      main { padding: .75rem; }
      .card { padding: .6rem .75rem; }
    }
    @media (max-width: 375px) { .cards { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
<header class="site-header">
  <a class="brand" href="/dashboard">Tachyon</a>
  {% if user_email %}<span class="user-email">{{ user_email }}</span>{% endif %}
</header>
<main>
  {% block content %}{% endblock %}
</main>
</body>
</html>
