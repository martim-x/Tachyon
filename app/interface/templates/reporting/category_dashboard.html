<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Расходы по категориям</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      color: #0f172a;
      margin: 0;
      background-color: #f8fafc;
    }
    .dashboard {
      max-width: 720px;
      margin: 0 auto;
      padding: 16px;
    }
    .dashboard__title {
      margin: 0 0 4px;
      font-size: 24px;
    }
    .dashboard__period {
      margin: 0 0 16px;
      color: #475569;
    }
    .category-chart__table {
      width: 100%;
      border-collapse: collapse;
      background-color: #ffffff;
    }
    .category-chart__caption {
      text-align: left;
      font-weight: 600;
      padding: 8px 4px;
    }
    .category-chart__cell {
      padding: 6px 4px;
      text-align: left;
    }
    .category-chart__bar {
      display: block;
      height: 10px;
      border-radius: 4px;
      background-color: transparent;
    }
    .category-chart__bar_cell {
      padding: 0 4px 6px;
    }
    .category-chart__swatch {
      display: inline-block;
      width: 12px;
      height: 12px;
      border-radius: 3px;
      margin-right: 6px;
      vertical-align: middle;
      background-color: transparent;
    }
    .category-chart__row_other {
      color: #64748b;
    }
    .category-chart__empty {
      color: #475569;
      background-color: #ffffff;
      padding: 12px;
    }
    .category-chart__total {
      font-weight: 600;
      border-top: 1px solid #e2e8f0;
    }
  </style>
</head>
<body>
<main class="dashboard">
  <header class="dashboard__header">
    <h1 class="dashboard__title">Расходы по категориям</h1>
    <p class="dashboard__period">Период: {{ period_from }} — {{ period_to }}</p>
  </header>
  {% include "reporting/category_chart.html" %}
</main>
</body>
</html>
