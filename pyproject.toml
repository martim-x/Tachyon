[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "tachyon"
version = "0.1.0"
description = "Многопользовательский трекер доходов и расходов"
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.21,<1",
    "alembic>=1.14,<2",
    "fastapi>=0.115,<1",
    "greenlet>=3.1,<4",
    "pydantic-settings>=2.7,<3",
    "sqlalchemy[asyncio]>=2.1,<3",
    "uvicorn[standard]>=0.34,<1",
    "bcrypt>=5,<6",
    "PyJWT>=2.10,<3",
    "email-validator>=2.2,<3",
    "apscheduler>=3.10,<4",
    "pandas>=2.2,<3",
    "jinja2>=3.1,<4",
    "reportlab>=4,<6",
    "numpy>=1.26,<2; python_version < '3.13'",
    "numpy>=2.1,<3; python_version >= '3.13'",
    "openpyxl>=3.1,<4",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.25,<1",
    "ruff>=0.9,<1",
    "mypy>=1.13,<2",
    "bandit>=1.8,<2",
    "pandas-stubs>=2.2,<3",
    "types-openpyxl>=3.1,<4",
    "types-reportlab>=4.4,<6",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.interface" = ["templates/**/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration", "tests/e2e"]
pythonpath = [".", "tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
markers = [
    "unit: быстрые тесты без БД/сети",
    "integration: тесты с БД, миграциями, ASGI",
    "e2e: сквозные сценарии из tests/e2e (запускается отдельной командой)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false
no_implicit_optional = true
strict_optional = true
show_error_codes = true
namespace_packages = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = [
    "tests.*",
    "alembic.*",
    "migrations.*",
]
ignore_errors = true

[tool.bandit]
exclude_dirs = ["tests", "migrations", ".venv"]
targets = ["app"]
