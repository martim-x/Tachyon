[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "tachyon"
version = "0.1.0"
description = "Многопользовательский трекер доходов и расходов"
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.21,<1",
    "alembic>=1.14,<2",
    "fastapi>=0.115,<1",
    "greenlet>=3.1,<4",
    "pydantic-settings>=2.7,<3",
    "sqlalchemy[asyncio]>=2.0.36,<3",
    "uvicorn[standard]>=0.34,<1",
    "bcrypt>=5,<6",
    "PyJWT>=2.10,<3",
    "email-validator>=2.2,<3",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.25,<1",
    "ruff>=0.9,<1",
    "mypy>=1.13,<2",
    "bandit>=1.8,<2",
    "isort>=5.13,<6",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration"]
pythonpath = [".", "tests"]
asyncio_mode = "auto"
addopts = "-q"
markers = [
    "unit: быстрые тесты без БД/сети",
    "integration: тесты с БД, миграциями, ASGI",
    "e2e: сквозные сценарии из tests/e2e (запускается отдельной командой)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false
no_implicit_optional = true
strict_optional = true
show_error_codes = true
namespace_packages = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = [
    "tests.*",
    "alembic.*",
]
ignore_errors = true

[[tool.mypy.overrides]]
module = [
    "app.core.config",
    "app.interface.api.exception_handlers",
    "app.core.persistence.scoped_repository",
    "app.domains.ledger.repository",
    "app.domains.scheduling.service",
    "app.domains.ledger.api",
]
ignore_errors = true

[tool.bandit]
exclude_dirs = ["tests", "migrations", ".venv"]
targets = ["app"]