repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        args: [--config-file=pyproject.toml, --install-types, --non-interactive]
        additional_dependencies:
          - pydantic
          - fastapi
          - sqlalchemy
          - alembic
          - pydantic-settings
          - email-validator
          - bcrypt
          - PyJWT
        pass_filenames: true
        files: ^app/
