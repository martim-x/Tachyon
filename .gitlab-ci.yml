image: python:3.12-slim

stages:
  - quality

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  paths:
    - .cache/pip

quality:
  stage: quality

  before_script:
    - python -m pip install --upgrade pip
    - python -m pip install -r requirements.txt

  script:
    - python -m ruff check .
    - python -m pytest